<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SalonOne｜予約管理（スマホ）minimo連携枠</title>
<!--
================================================================================
[minimo連携枠] スマホの予約表で連携枠を直接編集する  → 移植先: /schedule（スマホ）
================================================================================
■ 現状の課題
  ピンクの縦バーが細く閲覧専用で、スマホから枠を調整できない。
  タップ判定も狭く誤タップしやすい。変更がminimoへ同期されたか画面から分からない。

■ 操作仕様
  1. ピンクのバーをタップ … 編集モード（列全幅の半透明ブロック＋上下ハンドル）
  2. ブロック本体をドラッグ … 枠全体を移動（15分スナップ）
  3. 上下ハンドルをドラッグ … 開始/終了を伸縮（最小15分）
  4. 空き時間を長押し(500ms) … 新規枠を60分で作成し編集モードへ（触覚フィードバックあり）
  5. 画面下の操作バー … 時刻表示／削除／キャンセル／保存
  6. 予約・他のminimo枠と重なると赤表示＋保存不可
  7. 保存/削除で同期ボタンに「未同期件数」バッジ → 同期でクリア

■ 実装定数
  DAY_START=9:00 / DAY_END=19:00 / SNAP=15分 / PX15=26px（短縮表示は16px）
  内部の時刻はすべて「0:00からの分(int)」で保持し、描画時のみpxへ変換する。

■ 移植メモ
  ・Pointer Events(down/move/up + setPointerCapture)は useSlotDrag フックへそのまま移せる
  ・ドラッグ中は再レンダーせず style を直更新する。毎フレーム setState を呼ぶとスマホでカクつく
  ・ゴースト／ハンドルには touch-action:none 必須（iOSのスクロール暴発防止）
  ・楽観更新＋失敗時ロールバック。同期は非同期ジョブなので「未同期」表示を必ず残す

■ API
  GET    /api/stores/:sid/minimo-slots?date=YYYY-MM-DD
  POST   /api/stores/:sid/minimo-slots
  PATCH  /api/minimo-slots/:id
  DELETE /api/minimo-slots/:id
  POST   /api/stores/:sid/minimo-slots/sync    minimo側へ反映
================================================================================
-->
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<style>
:root{ --gold-soft:#F1E6CF; --paper:#FDFDFB;
       --res-bg:#EAF6EE; --res-bd:#8FC49E; --res-badge:#3E9B5F;
       --danger2:#DC2626; --danger2-soft:rgba(220,38,38,.12); }
*{touch-action:manipulation;}
body{background:#E7E7E0;}

.frame{
  max-width:430px; margin:0 auto; min-height:100dvh;
  background:var(--cream); box-shadow:0 0 40px rgba(0,0,0,.10);
  padding-bottom:24px; position:relative;
}
body.editing .frame{padding-bottom:150px;}

/* ---------- ヘッダー ---------- */
.appbar{
  display:flex; align-items:center; gap:8px;
  padding:10px 12px; background:var(--paper); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:40;
}
.iconbtn{
  width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; background:#fff; flex:0 0 auto;
}
.iconbtn.plain{border:none; background:none;}
.iconbtn svg{width:19px; height:19px; stroke:var(--ink); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.iconbtn.gold{border-color:var(--gold);}
.iconbtn.gold svg{stroke:var(--gold);}
.appbar select{
  height:38px; border:1px solid var(--line); border-radius:10px; background:#fff;
  padding:0 8px; min-width:0; flex:1; color:var(--ink);
}
.avatar{
  width:38px; height:38px; border-radius:50%; background:var(--teal); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; flex:0 0 auto;
}

/* ---------- タイトル・日付・操作列 ---------- */
.titlebar{display:flex; align-items:center; gap:10px; padding:14px 14px 4px;}
.titleicon{width:34px; height:34px; border-radius:9px; background:#EAF0EC; display:flex; align-items:center; justify-content:center;}
.titleicon svg{width:18px; height:18px; stroke:var(--teal); fill:none; stroke-width:1.8;}
.titlebar h1{font-size:19px; margin:0; font-weight:700; letter-spacing:.02em;}
.toggle{display:flex; align-items:center; gap:8px; margin-left:auto; color:var(--mut); font-size:12px;}
.switch{position:relative; width:40px; height:22px; flex:0 0 auto;}
.switch input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer;}
.switch i{position:absolute; inset:0; background:#D8D8D0; border-radius:999px; transition:background .15s;}
.switch i::after{
  content:''; position:absolute; top:2px; left:2px; width:18px; height:18px;
  background:#fff; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s;
}
.switch input:checked + i{background:var(--gold);}
.switch input:checked + i::after{left:20px;}

.datebar{display:flex; align-items:center; gap:8px; padding:8px 14px 0;}
.navbtn{height:36px; min-width:36px; padding:0 12px; border:1px solid var(--line); border-radius:9px; background:#fff; font-size:13px;}
.datebar .date{font-size:16px; font-weight:700; margin-left:4px;}
.datebar .caret{color:var(--mut); font-size:11px;}
.lastsync{padding:2px 14px 0; font-size:11px; color:var(--mut); text-align:right;}

.controlbar{display:flex; align-items:center; gap:8px; padding:8px 14px; flex-wrap:wrap;}
.ctl{
  height:38px; border:1px solid var(--line); border-radius:10px; background:#fff;
  display:flex; align-items:center; justify-content:center; gap:6px; padding:0 12px;
  font-size:13px; position:relative;
}
.ctl svg{width:16px; height:16px; stroke:var(--ink); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.badge{
  position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 4px;
  background:var(--pink); color:#fff; font-size:11px; font-weight:700;
  border-radius:999px; display:flex; align-items:center; justify-content:center;
}
/* display:flex はUA既定の [hidden]{display:none} を上書きしてしまうため、明示的に打ち消す。
   これが無いと未同期0件でもバッジが「0」で出たままになる（React移植時も同じ罠に注意） */
.badge[hidden]{display:none;}
.seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; margin-left:auto;}
.seg button{height:38px; padding:0 14px; font-size:13px; color:var(--mut);}
.seg button.on{background:var(--teal); color:#fff; font-weight:600;}
.createbtn{
  margin:2px 14px 8px; height:42px; padding:0 16px; border-radius:10px;
  background:var(--teal); color:#fff; font-size:14px; font-weight:600;
  display:inline-flex; align-items:center; gap:8px;
}
.createbtn svg{width:15px; height:15px; stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round;}

/* ---------- ヒント ---------- */
.hint{
  margin:0 14px 10px; padding:9px 12px; border-radius:10px;
  background:var(--pink-soft); border:1px solid rgba(244,63,94,.35);
  font-size:12px; color:#8f2340; display:flex; gap:10px; align-items:flex-start;
}
.hint b{color:#8f2340;}
.hint .close{margin-left:auto; color:#8f2340; font-size:15px; line-height:1; padding:2px;}

/* ---------- スタッフヘッダー ---------- */
.staffhead{
  display:flex; position:sticky; top:58px; z-index:30;
  background:var(--paper); border-top:1px solid var(--line); border-bottom:1px solid var(--line);
}
.sh-gutter{width:48px; flex:0 0 auto;}
.sh-cell{flex:1; text-align:center; padding:8px 4px 7px; border-left:1px solid var(--line);}
.sh-cell .nm{font-weight:700; font-size:14px;}
.sh-cell .sf{font-size:11px; color:var(--mut);}
.sh-cell .mtag{
  display:inline-block; margin-top:3px; font-size:10px; font-weight:600;
  color:var(--pink); background:var(--pink-soft); border-radius:6px; padding:1px 7px;
}

/* ---------- タイムグリッド ---------- */
.board{display:flex; background:var(--paper);}
.gutter{width:48px; flex:0 0 auto; position:relative;}
.hlabel{position:absolute; right:8px; transform:translateY(-50%); font-size:11px; color:var(--mut); font-variant-numeric:tabular-nums;}
.cols{flex:1; position:relative; display:flex;}
.gridlines{position:absolute; left:0; right:0; top:0; pointer-events:none;}
.gl{position:absolute; left:0; right:0; border-top:1px solid var(--line);}
.gl.quarter{border-top:1px dashed #ECECE4;}
.col{flex:1; position:relative; border-left:1px solid var(--line);}
.col::before{ /* minimoレーンの目安線 */
  content:''; position:absolute; left:26px; top:0; bottom:0;
  border-left:1px dashed #EFE3E6; pointer-events:none;
}
.items{position:absolute; inset:0;}
.nowline{position:absolute; left:0; right:0; height:0; border-top:1.5px solid var(--pink); pointer-events:none; z-index:5;}
.nowline::before{content:''; position:absolute; left:-3px; top:-4px; width:7px; height:7px; border-radius:50%; background:var(--pink);}

/* minimoバー（通常表示） */
.mbar{position:absolute; left:0; width:26px; z-index:6; touch-action:manipulation;}
.mbar-line{position:absolute; left:8px; top:1px; bottom:1px; width:9px; background:var(--pink); border-radius:5px; box-shadow:0 1px 2px rgba(244,63,94,.35);}
.mbar:active .mbar-line{filter:brightness(.92);}

/* 予約カード */
.res{
  position:absolute; left:30px; right:5px; z-index:7;
  background:var(--res-bg); border:1.5px solid var(--res-bd); border-radius:10px;
  padding:6px 8px; overflow:hidden;
}
.res .nm{font-weight:700; font-size:13px;}
.res .chips{display:flex; gap:5px; margin-top:4px; flex-wrap:wrap;}
.chip{font-size:10px; font-weight:600; border-radius:6px; padding:1px 7px;}
.chip.code{background:#5B6B77; color:#fff;}
.chip.member{background:var(--gold-soft); color:#8A6D2F;}
.res .src{
  position:absolute; top:5px; right:5px; width:18px; height:18px; border-radius:5px;
  background:var(--res-badge); color:#fff; font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}

/* 編集ゴースト */
.ghost{
  position:absolute; left:2px; right:2px; z-index:20;
  background:var(--pink-soft); border:1.5px solid var(--pink); border-radius:10px;
  touch-action:none; user-select:none; -webkit-user-select:none;
  box-shadow:0 4px 14px rgba(244,63,94,.22);
}
.ghost .gname{
  position:absolute; top:6px; left:8px; font-size:10px; font-weight:700;
  color:var(--pink); background:#fff; border-radius:6px; padding:1px 7px;
  border:1px solid rgba(244,63,94,.4);
}
.ghost.tiny .gname{display:none;}
.glabel{
  position:absolute; right:6px; font-size:11px; font-weight:700; color:var(--pink);
  background:rgba(255,255,255,.9); border-radius:5px; padding:0 5px; font-variant-numeric:tabular-nums;
}
.glabel.top{top:3px;} .glabel.bot{bottom:3px;}
.handle{
  position:absolute; left:50%; transform:translateX(-50%);
  width:64px; height:34px; display:flex; align-items:center; justify-content:center; touch-action:none;
}
.handle.top{top:-17px;} .handle.bot{bottom:-17px;}
.handle span{
  width:38px; height:15px; background:#fff; border:1.5px solid var(--pink);
  border-radius:9px; box-shadow:0 1px 4px rgba(0,0,0,.18);
  display:flex; align-items:center; justify-content:center;
}
.handle i{width:16px; height:2px; background:var(--pink); border-radius:2px; display:block; transform:translateY(-2px); box-shadow:0 4px 0 var(--pink);}
.ghost.conflict{border-color:var(--danger2); background:var(--danger2-soft);}
.ghost.conflict .glabel, .ghost.conflict .gname{color:var(--danger2); border-color:rgba(220,38,38,.4);}
.ghost.conflict .handle span{border-color:var(--danger2);}
.ghost.conflict .handle i{background:var(--danger2); box-shadow:0 4px 0 var(--danger2);}

/* ---------- 編集バー ---------- */
.editbar{
  position:fixed; left:50%; transform:translate(-50%,110%); bottom:0;
  width:100%; max-width:430px; z-index:60;
  background:#fff; border-top:1px solid var(--line); border-radius:16px 16px 0 0;
  box-shadow:0 -8px 24px rgba(0,0,0,.14);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  transition:transform .18s ease;
}
.editbar.show{transform:translate(-50%,0);}
.eb-info{display:flex; align-items:center; gap:10px;}
.eb-dot{width:10px; height:10px; border-radius:3px; background:var(--pink); flex:0 0 auto;}
.eb-title{font-size:12px; color:var(--mut);}
.eb-time{font-size:17px; font-weight:700; font-variant-numeric:tabular-nums;}
.eb-warn{margin-top:8px; font-size:12px; font-weight:600; color:var(--danger2); background:var(--danger2-soft); border-radius:8px; padding:6px 10px;}
.eb-actions{display:flex; gap:8px; margin-top:10px;}
.eb-actions .btn{height:44px; font-size:14px;}
.eb-actions .btn.outline{flex:1; border:1px solid var(--line); background:#fff; color:var(--ink);}
.eb-actions .btn.outline.danger{color:var(--danger2); border-color:rgba(220,38,38,.45);}
.eb-actions .btn.solid{flex:1.4;}

body.editing .toast{bottom:150px;}
.footnote{padding:14px; font-size:11px; color:var(--mut); text-align:center;}
</style>
</head>
<body>
<div class="frame">

  <header class="appbar">
    <button class="iconbtn plain" aria-label="メニュー"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <select aria-label="ブランド"><option>si'se</option></select>
    <select aria-label="エリア"><option>東京都</option></select>
    <div class="avatar">ro</div>
    <button class="iconbtn" aria-label="運営管理"><svg viewBox="0 0 24 24"><path d="M4 21V5l8-2v18M12 21h8V9l-8-2M7 9h1M7 13h1M7 17h1M16 12h1M16 16h1"/></svg></button>
    <button class="iconbtn gold" aria-label="ログアウト"><svg viewBox="0 0 24 24"><path d="M14 4h-8v16h8M10 12h10M17 8l3.5 4-3.5 4"/></svg></button>
  </header>

  <div class="titlebar">
    <div class="titleicon"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg></div>
    <h1>予約管理</h1>
    <label class="toggle"><span class="switch"><input type="checkbox" id="tglShort"><i></i></span>短縮表示</label>
  </div>

  <div class="datebar">
    <button class="navbtn" aria-label="前日">&#x2039;</button>
    <button class="navbtn">今日</button>
    <button class="navbtn" aria-label="翌日">&#x203A;</button>
    <span class="date" id="theDate">—</span><span class="caret">&#x25BE;</span>
  </div>
  <div class="lastsync" id="lastSync">最終同期 8/19 10:00</div>

  <div class="controlbar">
    <button class="ctl" id="btnRefresh" aria-label="更新"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/></svg></button>
    <button class="ctl" id="btnSync">
      <svg viewBox="0 0 24 24"><path d="M7 9l-3 3 3 3M17 9l3 3-3 3M4 12h16"/></svg>
      同期<span class="badge" id="syncBadge" hidden>0</span>
    </button>
    <button class="ctl" id="btnChart" aria-label="集計"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
    <div class="seg" role="tablist">
      <button class="on">日</button><button id="segW">週</button><button id="segM">月</button>
    </div>
  </div>
  <button class="createbtn" id="btnCreate"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>予約作成</button>

  <div class="hint" id="hint">
    <div><b>ピンクのバー＝minimo連携枠</b>。タップで編集、空き時間を<b>長押し</b>で新規作成できます。</div>
    <button class="close" id="hintClose" aria-label="閉じる">&#x2715;</button>
  </div>

  <div class="staffhead" id="staffhead"><div class="sh-gutter"></div></div>

  <div class="board">
    <div class="gutter" id="gutter"></div>
    <div class="cols" id="cols"></div>
  </div>

  <div class="footnote">モック ／ 実装メモはソース冒頭コメントと claude_code_handoff.md 参照</div>
</div>

<div class="editbar" id="editbar" aria-hidden="true">
  <div class="eb-info">
    <span class="eb-dot"></span>
    <div><div class="eb-title">minimo連携枠</div><div class="eb-time" id="ebTime">--:-- – --:--</div></div>
  </div>
  <div class="eb-warn" id="ebWarn" hidden>予約・他のminimo枠と重なっています。位置を調整してください。</div>
  <div class="eb-actions">
    <button class="btn outline danger" id="btnDelete">削除</button>
    <button class="btn outline" id="btnCancel">キャンセル</button>
    <button class="btn solid" id="btnSave">保存</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="../assets/attendance.js"></script>
<script src="../assets/mockdata.js"></script>
<script>
'use strict';
const A = window.Attendance, M = window.MockData;

/* ================= 定数 ================= */
const DAY_START = 9 * 60;    // 9:00
const DAY_END   = 19 * 60;   // 19:00
const SNAP      = 15;        // 分
const TOP       = 12;        // グリッド上余白(px)
let   PX15      = 26;        // 15分の高さ(px)。短縮表示で16。

const ppm   = () => PX15 / 15;
const y     = m  => TOP + (m - DAY_START) * ppm();
const spanH = () => (DAY_END - DAY_START) * ppm() + TOP * 2;
const snap  = m  => Math.round(m / SNAP) * SNAP;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const fmt   = m  => Math.floor(m / 60) + ':' + A.pad(m % 60);
const fmtDur = m => { const h = Math.floor(m / 60), mm = m % 60;
  return h ? (mm ? h + '時間' + mm + '分' : h + '時間') : mm + '分'; };

/* ================= データ ================= */
const staffList    = M.SCHEDULE_STAFF;
let   slots        = M.minimoSlots();
const reservations = M.reservations();
let nextId = 1;
let dirty  = 0;      // 未同期の変更数

/* ================= 状態 ================= */
let edit = null;     // {slotId, staff, start, end, isNew}
let drag = null;     // {mode, y0, s0, e0}
let lp   = null;     // 長押し {timer, x, y, staff, rectTop}

const $ = id => document.getElementById(id);
const colsEl    = $('cols');
const gutterEl  = $('gutter');
const staffhead = $('staffhead');
const editbar   = $('editbar');
const ebTime    = $('ebTime');
const ebWarn    = $('ebWarn');
const btnSave   = $('btnSave');
const btnDelete = $('btnDelete');

(function(){ const d = new Date();
  $('theDate').textContent = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日(' + A.DOW[d.getDay()] + ')';
})();

/* ================= 構築 ================= */
function buildHead(){
  staffhead.querySelectorAll('.sh-cell').forEach(el => el.remove());
  staffList.forEach(st => {
    const c = document.createElement('div');
    c.className = 'sh-cell';
    c.innerHTML = '<div class="nm">' + st.name + '</div>' +
                  '<div class="sf">' + st.shiftLabel + '</div>' +
                  '<div class="mtag">minimo連携枠</div>';
    staffhead.appendChild(c);
  });
}

function build(){
  const H = spanH();

  gutterEl.style.height = H + 'px';
  gutterEl.innerHTML = '';
  for(let m = DAY_START; m <= DAY_END; m += 60){
    const d = document.createElement('div');
    d.className = 'hlabel'; d.style.top = y(m) + 'px'; d.textContent = fmt(m);
    gutterEl.appendChild(d);
  }

  colsEl.innerHTML = '';
  colsEl.style.height = H + 'px';
  const gl = document.createElement('div');
  gl.className = 'gridlines'; gl.style.height = H + 'px';
  for(let m = DAY_START; m <= DAY_END; m += SNAP){
    const l = document.createElement('div');
    l.className = (m % 60 === 0) ? 'gl' : 'gl quarter';
    l.style.top = y(m) + 'px';
    gl.appendChild(l);
  }
  colsEl.appendChild(gl);

  staffList.forEach(st => {
    const c = document.createElement('div');
    c.className = 'col'; c.dataset.staff = st.id; c.style.height = H + 'px';
    const items = document.createElement('div');
    items.className = 'items';
    c.appendChild(items);
    colsEl.appendChild(c);
  });

  const nl = document.createElement('div');
  nl.className = 'nowline'; nl.id = 'nowline';
  colsEl.appendChild(nl);

  renderItems();
  updateNow();
}

/* ================= 描画 ================= */
function renderItems(){
  staffList.forEach(st => {
    const items = colsEl.querySelector('.col[data-staff="' + st.id + '"] .items');
    if(!items) return;
    items.innerHTML = '';
    slots.filter(s => s.staff === st.id && !(edit && !edit.isNew && edit.slotId === s.id))
         .forEach(s => items.appendChild(makeBar(s)));
    reservations.filter(r => r.staff === st.id)
                .forEach(r => items.appendChild(makeRes(r)));
    if(edit && edit.staff === st.id) items.appendChild(makeGhost());
  });
  if(edit) refreshGhost();
  updateSyncBadge();
}

function makeBar(s){
  const b = document.createElement('div');
  b.className = 'mbar';
  b.style.top = y(s.start) + 'px';
  b.style.height = ((s.end - s.start) * ppm()) + 'px';
  b.innerHTML = '<span class="mbar-line"></span>';
  b.setAttribute('role', 'button');
  b.setAttribute('aria-label', 'minimo枠 ' + fmt(s.start) + 'から' + fmt(s.end) + '。タップで編集');
  b.addEventListener('pointerdown', e => e.stopPropagation()); // 長押し新規作成を抑止
  b.addEventListener('click', e => { e.stopPropagation(); enterEdit(s); });
  return b;
}

function makeRes(r){
  const d = document.createElement('div');
  d.className = 'res';
  d.style.top = y(r.start) + 'px';
  d.style.height = ((r.end - r.start) * ppm() - 2) + 'px';
  d.innerHTML = '<div class="nm">' + r.name + '</div>' +
    '<div class="chips"><span class="chip code">' + r.code + '</span>' +
    '<span class="chip member">' + r.tag + '</span></div>' +
    '<span class="src">' + r.src + '</span>';
  d.addEventListener('pointerdown', e => e.stopPropagation());
  d.addEventListener('click', e => { e.stopPropagation(); toast('予約詳細はこのモックの対象外です'); });
  return d;
}

function makeGhost(){
  const g = document.createElement('div');
  g.className = 'ghost'; g.id = 'ghost';
  g.innerHTML =
    '<span class="gname">minimo連携枠</span>' +
    '<span class="glabel top" id="glabelTop"></span>' +
    '<span class="glabel bot" id="glabelBot"></span>' +
    '<div class="handle top" data-h="start"><span><i></i></span></div>' +
    '<div class="handle bot" data-h="end"><span><i></i></span></div>';
  g.addEventListener('pointerdown', onGhostDown);
  g.addEventListener('pointermove', onGhostMove);
  g.addEventListener('pointerup', onGhostUp);
  g.addEventListener('pointercancel', onGhostUp);
  return g;
}

function refreshGhost(){
  const g = $('ghost');
  if(!g || !edit) return;
  const h = (edit.end - edit.start) * ppm();
  g.style.top = y(edit.start) + 'px';
  g.style.height = h + 'px';
  g.classList.toggle('tiny', h < 46);
  $('glabelTop').textContent = fmt(edit.start);
  $('glabelBot').textContent = fmt(edit.end);
  const conf = hasConflict();
  g.classList.toggle('conflict', conf);
  ebTime.textContent = fmt(edit.start) + ' – ' + fmt(edit.end) + '（' + fmtDur(edit.end - edit.start) + '）';
  ebWarn.hidden = !conf;
  btnSave.disabled = conf;
}

/* ================= ドラッグ =================
   ドラッグ中は state を更新して style を直接書き換える。
   React移植時も、この区間だけは setState を挟まずに ref + style 直更新にすること。 */
function onGhostDown(e){
  e.preventDefault(); e.stopPropagation();
  const h = e.target.closest('.handle');
  drag = { mode: h ? h.dataset.h : 'move', y0: e.clientY, s0: edit.start, e0: edit.end };
  e.currentTarget.setPointerCapture(e.pointerId);
}
function onGhostMove(e){
  if(!drag) return;
  e.preventDefault();
  const dm = (e.clientY - drag.y0) / ppm();
  if(drag.mode === 'move'){
    const dur = drag.e0 - drag.s0;
    edit.start = clamp(snap(drag.s0 + dm), DAY_START, DAY_END - dur);
    edit.end   = edit.start + dur;
  }else if(drag.mode === 'start'){
    edit.start = clamp(snap(drag.s0 + dm), DAY_START, edit.end - SNAP);
  }else{
    edit.end   = clamp(snap(drag.e0 + dm), edit.start + SNAP, DAY_END);
  }
  refreshGhost();
}
function onGhostUp(){ drag = null; }

/** 同一スタッフの予約・他のminimo枠と重ならないこと */
function hasConflict(){
  if(!edit) return false;
  const s = edit.start, en = edit.end;
  const resHit  = reservations.some(r => r.staff === edit.staff && s < r.end && en > r.start);
  const slotHit = slots.some(o => o.staff === edit.staff && o.id !== edit.slotId && s < o.end && en > o.start);
  return resHit || slotHit;
}

/* ================= 編集モード ================= */
function enterEdit(s){
  if(edit){ toast('編集中の枠があります。保存かキャンセルをしてください'); return; }
  edit = s.id
    ? { slotId: s.id, staff: s.staff, start: s.start, end: s.end, isNew: false }
    : { slotId: null, staff: s.staff, start: s.start, end: s.end, isNew: true };
  document.body.classList.add('editing');
  btnDelete.style.display = edit.isNew ? 'none' : 'flex';
  renderItems();
  editbar.classList.add('show');
  editbar.setAttribute('aria-hidden', 'false');
}
function exitEdit(){
  edit = null; drag = null;
  document.body.classList.remove('editing');
  editbar.classList.remove('show');
  editbar.setAttribute('aria-hidden', 'true');
  renderItems();
}

btnSave.addEventListener('click', () => {
  if(!edit || hasConflict()) return;
  const range = fmt(edit.start) + '–' + fmt(edit.end);
  if(edit.isNew){
    slots.push({ id: 'n' + (nextId++), staff: edit.staff, start: edit.start, end: edit.end });
  }else{
    const t = slots.find(o => o.id === edit.slotId);
    t.start = edit.start; t.end = edit.end;
  }
  dirty++;
  exitEdit();
  toast('minimo枠を保存しました（' + range + '・同期待ち）');
});
$('btnCancel').addEventListener('click', exitEdit);
btnDelete.addEventListener('click', () => {
  if(!edit || edit.isNew){ exitEdit(); return; }
  slots = slots.filter(o => o.id !== edit.slotId);
  dirty++;
  exitEdit();
  toast('minimo枠を削除しました（同期待ち）');
});

/* ================= 長押しで新規作成 ================= */
colsEl.addEventListener('pointerdown', e => {
  if(edit) return;
  const col = e.target.closest('.col');
  if(!col) return;
  const rectTop = col.getBoundingClientRect().top;
  lp = {
    x: e.clientX, y: e.clientY, staff: col.dataset.staff, rectTop: rectTop,
    timer: setTimeout(() => {
      const center = DAY_START + (lp.y - lp.rectTop - TOP) / ppm();
      const start  = clamp(snap(center - 30), DAY_START, DAY_END - 60);
      if(navigator.vibrate) navigator.vibrate(15);
      const staff = lp.staff;
      lp = null;
      enterEdit({ staff: staff, start: start, end: start + 60 });
    }, 500)
  };
});
['pointermove', 'pointerup', 'pointercancel'].forEach(ev => {
  colsEl.addEventListener(ev, e => {
    if(!lp) return;
    if(ev !== 'pointermove' || Math.abs(e.clientX - lp.x) > 8 || Math.abs(e.clientY - lp.y) > 8){
      clearTimeout(lp.timer); lp = null;
    }
  });
});

/* ================= 同期・その他UI ================= */
function updateSyncBadge(){
  const b = $('syncBadge');
  b.hidden = dirty === 0;
  b.textContent = dirty;
}
$('btnSync').addEventListener('click', () => {
  if(dirty){
    toast(dirty + '件の変更をminimoへ同期しました（モック）');
    dirty = 0;
    updateSyncBadge();
    $('lastSync').textContent = '最終同期 たった今';
  }else{
    toast('同期しました（変更なし）');
  }
});
$('btnRefresh').addEventListener('click', () => toast('最新の状態に更新しました（モック）'));
$('btnChart').addEventListener('click',   () => toast('集計はこのモックの対象外です'));
$('btnCreate').addEventListener('click',  () => toast('予約作成はこのモックの対象外です'));
$('segW').addEventListener('click', () => toast('モックでは「日」表示のみ対応しています'));
$('segM').addEventListener('click', () => toast('モックでは「日」表示のみ対応しています'));
$('hintClose').addEventListener('click', () => $('hint').remove());
$('tglShort').addEventListener('change', e => { PX15 = e.target.checked ? 16 : 26; build(); });

/* ================= 現在時刻ライン ================= */
function updateNow(){
  const nl = $('nowline');
  if(!nl) return;
  const d = new Date();
  const m = d.getHours() * 60 + d.getMinutes();
  if(m < DAY_START || m > DAY_END){ nl.style.display = 'none'; return; }
  nl.style.display = 'block';
  nl.style.top = y(m) + 'px';
}
setInterval(updateNow, 30000);

/* ================= トースト ================= */
let toastT;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

buildHead();
build();
</script>
