<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalonOne｜勤怠管理</title>
<!--
================================================================================
[勤怠管理] 月次の打刻実績を確認・修正・承認する  → 移植先: /time-tracking
  サイドバー上の位置: 設定 > 管理設定 > 労務管理 > 勤怠管理
================================================================================
■ 現行実装のバグと、この画面での対処
  ① 時間表記が小数のまま
     現行: 合計 8h43.7166666666667m ／ 休憩 1h1.1666666666666643m
     → 表示は必ず assets/attendance.js の fmtHM()/fmtJa() を通す。
        本命の対処はAPI側で整数分に丸めること。
        mockdata.js の brk は現行APIが返す float のまま置いてあり、
        画面で 1:01 と出ていれば丸めが効いている確認になる（整数に直さないこと）。
  ② 退勤未打刻の行が「—」で終わり気づけない
     → 行を赤地＋「退勤未打刻」バッジ、上部にアラート集約、そこから絞り込み。
  ③ 絞り込みが対象月だけ
     → 月／スタッフ／状態の3フィルタ＋スタッフ単位の小計。
  ④ 打刻を修正できない
     → 行から修正モーダル。理由必須で履歴に残す。
        退勤が未打刻の日はシフト終了時刻を初期値に入れる（入力の手間を減らす）。
  ⑤ スマホで横スクロールになる
     → 768px未満はテーブルを捨ててカードへ。

■ 用語
  現行の列名は「勤務時間」。このモックでは拘束時間と紛れないよう「実働」にしている。
  どちらに揃えるかは要確認。

■ 固定残業（みなし残業）
  サロン・整体院は固定残業で回している店舗が多いため、月あたりの上限に対して
  消化状況を出す。SHOP.fixedOvertimeMinutes（既定30時間）。
    通常 … 上限内
    注意 … 上限の80%以上（SHOP.overtimeAlertRatio）。超えそうなので先に手を打てる
    超過 … 上限超え。超過分は別途支給が要るので給与計算前に必ず気づかせる
  上限を 0 にすると固定残業なしの運用となり、この表示は出ない。
  雇用形態ごと／スタッフごとに違う可能性が高く、設定単位は要確認（メモ §5-6と同じ論点）。

■ 休憩機能のオン/オフ
  休憩を管理しない店舗があるため店舗ごとの設定。SHOP.breakEnabled。
  OFFのとき: 休憩列・休憩合計KPI・CSVの休憩列を出さず、実働 = 退勤 − 出勤 とする。

■ 集計ルール
  実働 = 退勤 − 出勤 − 休憩合計 ／ 残業 = max(0, 実働 − 所定労働時間(既定480分))
  打刻漏れの日は実働 null。0分として合計に混ぜず、件数だけ数える。
  深夜割増・法定休日割増は未計算（メモ §5-8）。

■ 権限
  権限マトリックス上、シフト・勤怠・給与は全ロールが可視範囲内で全操作可。
  ただし店舗スタッフが自分の勤怠を修正できる状態は給与計算の統制上リスクがあるため、
  ロール別に修正可否を分けるかは要確認（メモ §5-9）。

■ API
  GET   /api/attendance?month=YYYY-MM&staff_id=   月次一覧（整数分で返す）
  PATCH /api/attendance/:staffId/:date            打刻修正（reason必須）
  POST  /api/attendance/approve                   月次承認
  GET   /api/attendance/export?month=YYYY-MM      CSV
================================================================================
-->
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/shell.css">
<style>
.filters{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
.filters .fl{font-size:12px; color:var(--mut);}
.filters select{height:40px; border:1px solid var(--line); border-radius:10px; background:#fff; padding:0 10px;}
.filters .spacer{margin-left:auto;}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px;}
.kpi{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px;}
.kpi .l{font-size:11.5px; color:var(--mut);}
.kpi .v{font-size:22px; font-weight:700; letter-spacing:.01em; margin-top:2px;}
.kpi .v small{font-size:12px; font-weight:600; color:var(--mut); margin-left:2px;}
.kpi.alert{border-color:rgba(196,52,43,.35);}
.kpi.alert .v{color:var(--danger);}

.staffblock{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); margin-bottom:14px; overflow:hidden;}
.sbhead{display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--muted-bg); border-bottom:1px solid var(--line); flex-wrap:wrap;}
.sbhead .nm{font-weight:700; font-size:15px;}
.sbhead .st{font-size:12px; color:var(--mut);}
.sbhead .tot{margin-left:auto; font-size:12.5px; color:var(--mut); white-space:nowrap;}
.sbhead .tot b{font-size:15px; color:var(--ink);}
.sbhead .ap{font-size:11px; font-weight:700; border-radius:999px; padding:3px 10px; background:var(--ok-soft); color:var(--ok);}

/* 固定残業の消化状況 */
.fixot{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 16px; border-bottom:1px solid var(--line); background:#FCFCF8; font-size:12.5px;
}
.fixot .l{color:var(--mut); font-size:11.5px; white-space:nowrap;}
.fixot .bar{
  flex:1; min-width:120px; height:7px; border-radius:999px; background:#E7E7DF;
  overflow:hidden; position:relative;
}
.fixot .bar i{display:block; height:100%; border-radius:999px; background:var(--ok); transition:width .2s;}
.fixot .v{font-variant-numeric:tabular-nums; white-space:nowrap;}
.fixot .v b{font-size:13.5px;}
.fixot.warn .bar i{background:var(--warn);}
.fixot.over .bar i{background:var(--danger);}
.fixot.warn{background:var(--warn-soft);}
.alertbar.warn{background:var(--warn-soft); border-color:rgba(180,116,11,.3); color:var(--warn);}
.alertbar.warn .go{color:var(--warn);}
.fixot.over{background:var(--danger-soft);}

table{width:100%; border-collapse:collapse;}
thead th{font-size:11.5px; color:var(--mut); font-weight:600; text-align:center; padding:9px 8px; border-bottom:1px solid var(--line); background:#FAFAF6;}
thead th.l{text-align:left;}
tbody td{padding:11px 8px; border-bottom:1px solid var(--line); text-align:center; font-size:13.5px;}
tbody td.l{text-align:left;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.miss{background:var(--danger-soft);}
.dow{color:var(--mut); font-size:12px; margin-left:3px;}
.dow.sat{color:#2F6DA8;} .dow.sun{color:#C4342B;}
.fixbtn{font-size:12px; color:var(--teal-3); text-decoration:underline; font-weight:600;}

.hintline{font-size:11.5px; color:var(--info); background:var(--info-soft); border-radius:8px; padding:7px 10px; margin:-4px 0 12px; line-height:1.5;}

.mobcards{display:none;}
@media (max-width:768px){
  .kpis{grid-template-columns:repeat(2,1fr);}
  .kpi:first-child{grid-column:span 2;}
  .filters select{flex:1; min-width:calc(50% - 5px);}
  .filters .fl{display:none;}
  .filters .spacer{margin-left:0; width:100%; height:0;}
  .filters .btn{flex:1;}
  table.daytable{display:none;}
  .mobcards{display:block; padding:8px 12px 12px;}
  .mrow{border:1px solid var(--line); border-radius:11px; padding:10px 12px; margin-top:8px;}
  .mrow.miss{border-color:rgba(196,52,43,.45); background:var(--danger-soft);}
  .mrow .r1{display:flex; align-items:center; gap:8px;}
  .mrow .dt{font-weight:700;}
  .mrow .r1 .right{margin-left:auto; font-weight:700;}
  .mrow .r2{display:flex; gap:14px; margin-top:6px; font-size:12.5px; color:var(--mut); flex-wrap:wrap;}
  .mrow .r3{display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .sbhead .tot{margin-left:0; width:100%;}
}
</style>
</head>
<body>
<div id="shell"></div>

<!-- 打刻修正モーダル -->
<div class="mask" id="mask">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle">打刻を修正</h3>
    <div class="mdate" id="mDate">—</div>
    <div class="hintline" id="mShift" style="display:none"></div>
    <div class="mgrid">
      <div class="mfield"><label for="mIn">出勤</label><input type="time" id="mIn" step="60"></div>
      <div class="mfield"><label for="mOut">退勤</label><input type="time" id="mOut" step="60"></div>
    </div>
    <div class="mfield" id="mBreakField"><label for="mBreak">休憩（分）</label><input type="number" id="mBreak" min="0" max="480" step="5"></div>
    <div class="calcline"><span>実働時間</span><b id="mCalc">—</b></div>
    <div class="mfield">
      <label for="mReason">修正理由（必須・履歴に残ります）</label>
      <textarea id="mReason" placeholder="例：退勤打刻を忘れたため、シフト終了時刻で登録"></textarea>
    </div>
    <div class="err" id="mErr"></div>
    <div class="mactions">
      <button class="btn ghost" id="mCancel">キャンセル</button>
      <button class="btn solid" id="mSave">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="../assets/attendance.js"></script>
<script src="../assets/mockdata.js"></script>
<script src="../assets/shell.js"></script>
<script src="../assets/mockbar.js"></script>
<script>
'use strict';
const A = window.Attendance, M = window.MockData;
const $ = id => document.getElementById(id);

let role     = 'system';
let days     = M.attendanceDays();
let breakEnabled = M.SHOP.breakEnabled;
let fixedOtMin   = M.SHOP.fixedOvertimeMinutes;
let approved = false;
let target   = null;

const SVG_STOP = '<svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/>' +
                 '<path d="M12 10v3.5l2.2 1.5M9.5 3.5h5M12 3.5v3"/></svg>';

const PAGE =
  '<div class="pagehead"><span class="ic">' + SVG_STOP + '</span><h1>勤怠管理</h1>' +
  '<span class="sub">月次の打刻実績を確認・修正します</span></div>' +
  '<div class="card"><div class="filters">' +
    '<span class="fl">対象月</span>' +
    '<select id="fMonth"><option value="2026-08" selected>2026年8月</option>' +
      '<option value="2026-07">2026年7月</option></select>' +
    '<select id="fStaff"></select>' +
    '<select id="fStatus">' +
      '<option value="all">すべての状態</option>' +
      '<option value="miss">打刻漏れのみ</option>' +
      '<option value="edited">修正済みのみ</option>' +
      '<option value="fixot">固定残業 注意・超過のみ</option></select>' +
    '<span class="spacer"></span>' +
    '<button class="btn ghost" id="btnCsv">CSV出力</button>' +
    '<button class="btn solid" id="btnApprove">この月を承認</button>' +
  '</div></div>' +
  '<div class="kpis" id="kpis"></div><div id="alerts"></div><div id="list"></div>' +
  '<p class="note">所定労働時間は 8時間0分／日として残業を算出しています（設定値・要確認）。</p>';

function mount(r){
  role = r;
  const page = Shell.render({ active:'time-tracking', role: role });
  page.innerHTML = PAGE;

  const fs = $('fStaff');
  fs.innerHTML = '<option value="all">全スタッフ</option>';
  M.STAFF_ORDER.forEach(id => {
    const o = document.createElement('option');
    o.value = id; o.textContent = M.STAFF[id].name;
    fs.appendChild(o);
  });

  ['fMonth','fStaff','fStatus'].forEach(id => $(id).addEventListener('change', render));
  $('btnApprove').addEventListener('click', onApprove);
  $('btnCsv').addEventListener('click', onCsv);
  render();
}

/* ---------------- 休憩OFFの店舗への対応 ----------------
   休憩を管理しない店舗では、保存されている休憩分を計算に使わない。
   実働 = 退勤 − 出勤 とする。 */
const brkOf  = d    => (breakEnabled ? (d.brk || 0) : 0);
const asView = rows => (breakEnabled ? rows : rows.map(d => Object.assign({}, d, { brk: 0 })));

/* ---------------- 固定残業 ----------------
   スタッフ単位・月単位の集計。スタッフ絞り込みや状態絞り込みの影響を受けないよう、
   月だけで絞ったデータから計算する。 */
function fixedOtByStaff(){
  const month = $('fMonth').value;
  const out = {};
  M.STAFF_ORDER.forEach(sid => {
    const rows = asView(days.filter(d => d.staff === sid && d.date.startsWith(month)));
    if(!rows.length) return;
    const s = A.summarize(rows);
    out[sid] = A.fixedOvertimeState(s.overtime, fixedOtMin, M.SHOP.overtimeAlertRatio);
  });
  return out;
}

/* ---------------- 絞り込み ---------------- */
function filtered(){
  const staff = $('fStaff').value, status = $('fStatus').value, month = $('fMonth').value;
  const fx = status === 'fixot' ? fixedOtByStaff() : null;
  return days.filter(d => {
    if(!d.date.startsWith(month)) return false;
    if(staff !== 'all' && d.staff !== staff) return false;
    if(status === 'miss'   && d.out != null) return false;
    if(status === 'edited' && !d.edited)     return false;
    // 固定残業は日ではなくスタッフ単位の状態なので、該当スタッフの日をすべて残す
    if(status === 'fixot'){
      const f = fx[d.staff];
      if(!f || f.state === 'normal') return false;
    }
    return true;
  });
}

/* ---------------- 描画 ---------------- */
function render(){
  const rows = filtered();
  const s = A.summarize(asView(rows));
  const fx = fixedOtByStaff();
  const over = M.STAFF_ORDER.filter(id => fx[id] && fx[id].state === 'over');
  const warn = M.STAFF_ORDER.filter(id => fx[id] && fx[id].state === 'warn');

  $('kpis').innerHTML =
    kpi('総勤務時間', A.fmtJa(s.work)) +
    kpi('出勤日数',  s.days + '<small>日</small>') +
    (breakEnabled ? kpi('休憩合計', A.fmtJa(s.brk)) : '') +
    kpi('残業合計',  A.fmtJa(s.overtime)) +
    (fixedOtMin ? kpi('固定残業 超過', over.length + '<small>名</small>', over.length > 0) : '') +
    kpi('打刻漏れ',  s.missing + '<small>件</small>', s.missing > 0);

  /* --- アラート帯（打刻漏れ／固定残業） --- */
  let al = '';
  if(s.missing > 0){
    al += '<div class="alertbar"><b>退勤の打刻漏れが ' + s.missing + '件</b> あります。給与計算前に修正してください。' +
          '<button class="go" id="goMiss">該当だけ表示</button></div>';
  }
  if(fixedOtMin && (over.length || warn.length)){
    const nm = ids => ids.map(id => M.STAFF[id].name).join('・');
    let msg = '';
    if(over.length) msg += '<b>' + nm(over) + '</b> が固定残業（' + A.fmtJa(fixedOtMin) + '）を<b>超過</b>しています。';
    if(warn.length) msg += (msg ? ' ' : '') + '<b>' + nm(warn) + '</b> が上限に近づいています。';
    al += '<div class="alertbar' + (over.length ? '' : ' warn') + '">' + msg +
          '<button class="go" id="goFixot">該当だけ表示</button></div>';
  }
  $('alerts').innerHTML = al;

  const gm = $('goMiss');
  if(gm) gm.addEventListener('click', () => { $('fStatus').value = 'miss'; render(); });
  const gf = $('goFixot');
  if(gf) gf.addEventListener('click', () => { $('fStatus').value = 'fixot'; render(); });

  const list = $('list');
  list.innerHTML = '';
  const byStaff = {};
  rows.forEach(d => { (byStaff[d.staff] = byStaff[d.staff] || []).push(d); });
  const keys = M.STAFF_ORDER.filter(id => byStaff[id]);

  if(!keys.length){
    list.innerHTML = '<div class="card"><div class="note" style="padding:12px 2px">条件に一致する勤怠データがありません。</div></div>';
    return;
  }

  keys.forEach(sid => {
    const items = byStaff[sid].slice().sort((a, b) => a.date.localeCompare(b.date));
    const sub = A.summarize(asView(items));

    const f = fx[sid];
    const block = document.createElement('div');
    block.className = 'staffblock';
    block.innerHTML =
      '<div class="sbhead">' +
        '<div><div class="nm">' + M.STAFF[sid].name + '</div>' +
        '<div class="st">' + M.STAFF[sid].shop + ' ・ ' + items.length + '日出勤' +
        (sub.missing ? ' ・ <span style="color:var(--danger)">打刻漏れ ' + sub.missing + '件</span>' : '') +
        '</div></div>' +
        '<div class="tot">合計実働 <b>' + A.fmtJa(sub.work) + '</b></div>' +
        (approved ? '<span class="ap">承認済み</span>' : '') +
      '</div>' +
      fixotRow(f) +
      '<table class="daytable"><thead><tr>' +
        '<th class="l">日付</th><th>出勤</th><th>退勤</th>' +
        (breakEnabled ? '<th>休憩</th>' : '') +
        '<th>実働</th><th>状態</th><th></th>' +
      '</tr></thead><tbody></tbody></table>' +
      '<div class="mobcards"></div>';

    const tb = block.querySelector('tbody');
    const mc = block.querySelector('.mobcards');

    items.forEach(d => {
      const w    = A.calcWork(d.in, d.out, brkOf(d));
      const miss = (w == null);
      const ot   = A.calcOvertime(w);
      const dt   = new Date(d.date + 'T00:00:00');
      const di   = dt.getDay();
      const dlabel = (dt.getMonth() + 1) + '/' + dt.getDate() +
        '<span class="dow ' + (di === 0 ? 'sun' : di === 6 ? 'sat' : '') + '">(' + A.DOW[di] + ')</span>';

      let tags = '';
      if(miss)     tags += '<span class="tag miss">退勤未打刻</span> ';
      if(d.edited) tags += '<span class="tag edited">修正済</span> ';
      if(ot > 0)   tags += '<span class="tag ot">残業 ' + A.fmtJa(ot) + '</span>';
      if(!tags)    tags  = '<span class="tag off">通常</span>';

      const tr = document.createElement('tr');
      if(miss) tr.className = 'miss';
      tr.innerHTML =
        '<td class="l">' + dlabel + '</td>' +
        '<td class="mono">' + (d.in  != null ? A.toStr(d.in)  : '<span class="dash">—</span>') + '</td>' +
        '<td class="mono">' + (d.out != null ? A.toStr(d.out) : '<span class="dash">—</span>') + '</td>' +
        (breakEnabled ? '<td class="mono">' + A.fmtHM(d.brk) + '</td>' : '') +
        '<td class="mono"><b>' + (w != null ? A.fmtHM(w) : '<span class="dash">—</span>') + '</b></td>' +
        '<td>' + tags + '</td>' +
        '<td><button class="fixbtn">修正</button></td>';
      tr.querySelector('.fixbtn').addEventListener('click', () => openFix(d));
      tb.appendChild(tr);

      const card = document.createElement('div');
      card.className = 'mrow' + (miss ? ' miss' : '');
      card.innerHTML =
        '<div class="r1"><span class="dt">' + dlabel + '</span>' +
          '<span class="right mono">' + (w != null ? A.fmtJa(w) : '—') + '</span></div>' +
        '<div class="r2">' +
          '<span>出勤 <b class="mono">' + (d.in  != null ? A.toStr(d.in)  : '—') + '</b></span>' +
          '<span>退勤 <b class="mono">' + (d.out != null ? A.toStr(d.out) : '—') + '</b></span>' +
          (breakEnabled ? '<span>休憩 <b class="mono">' + A.fmtHM(d.brk) + '</b></span>' : '') +
        '</div>' +
        '<div class="r3">' + tags + '<span style="margin-left:auto"><button class="fixbtn">修正</button></span></div>';
      card.querySelector('.fixbtn').addEventListener('click', () => openFix(d));
      mc.appendChild(card);
    });

    list.appendChild(block);
  });
}

/** スタッフごとの固定残業の消化バー。固定残業なしの運用では出さない */
function fixotRow(f){
  if(!f) return '';
  const pct  = Math.min(100, f.percent);
  const over = f.state === 'over';
  const tag  = over ? '<span class="tag miss">' + A.fmtJa(Math.abs(f.remain)) + ' 超過</span>'
             : f.state === 'warn' ? '<span class="tag ot">残り ' + A.fmtJa(f.remain) + '</span>'
             : '';
  return '<div class="fixot ' + f.state + '">' +
           '<span class="l">固定残業</span>' +
           '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
           '<span class="v"><b>' + A.fmtJa(f.used) + '</b> / ' + A.fmtJa(f.limit) +
           '（' + f.percent + '%）</span>' + tag +
         '</div>';
}

function kpi(label, val, alert){
  return '<div class="kpi' + (alert ? ' alert' : '') + '">' +
         '<div class="l">' + label + '</div><div class="v tnum">' + val + '</div></div>';
}

/* ---------------- 修正モーダル ---------------- */
function openFix(d){
  target = d;
  $('mDate').textContent =
    M.STAFF[d.staff].name + ' ／ ' + d.date.replace(/-/g, '/') +
    (d.edited ? '（修正履歴あり：' + d.reason + '）' : '');
  $('mIn').value    = A.toStr(d.in);
  $('mBreak').value = Math.round(d.brk || 0);   // 入力欄にも小数を出さない
  $('mBreakField').style.display = breakEnabled ? '' : 'none';
  $('mReason').value = '';
  $('mErr').classList.remove('show');

  // 退勤が未打刻ならシフト終了時刻を初期値に入れる（打ち直しの手間を減らす）
  const sh = M.shiftOf(d.staff, d.date);
  const hint = $('mShift');
  if(d.out == null && sh){
    $('mOut').value = A.toStr(sh.end);
    hint.style.display = 'block';
    hint.textContent = 'シフトは ' + A.toStr(sh.start) + '–' + A.toStr(sh.end) +
                       ' です。退勤が未打刻のため、シフト終了時刻を初期値に入れました。';
  }else{
    $('mOut').value = A.toStr(d.out);
    if(sh){
      hint.style.display = 'block';
      hint.textContent = 'シフトは ' + A.toStr(sh.start) + '–' + A.toStr(sh.end) + ' です。';
    }else{
      hint.style.display = 'none';
    }
  }
  recalc();
  $('mask').classList.add('show');
}
function closeFix(){ $('mask').classList.remove('show'); target = null; }

function recalc(){
  const b = breakEnabled ? Number($('mBreak').value || 0) : 0;
  const w = A.calcWork(A.toMin($('mIn').value), A.toMin($('mOut').value), b);
  $('mCalc').textContent = (w != null ? A.fmtJa(w) : '退勤時刻を入力してください');
}
['mIn','mOut','mBreak'].forEach(id => $(id).addEventListener('input', recalc));

$('mCancel').addEventListener('click', closeFix);
$('mask').addEventListener('click', e => { if(e.target === $('mask')) closeFix(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && target) closeFix(); });

$('mSave').addEventListener('click', () => {
  if(!target) return;
  const i = A.toMin($('mIn').value), o = A.toMin($('mOut').value);
  const b = breakEnabled ? Number($('mBreak').value || 0) : 0;
  const r = $('mReason').value.trim();
  const err = $('mErr');
  const ng = m => { err.textContent = m; err.classList.add('show'); };

  if(i == null)                 return ng('出勤時刻を入力してください。');
  if(o != null && o <= i)       return ng('退勤時刻は出勤時刻より後にしてください。');
  if(breakEnabled && o != null && (o - i) < b) return ng('休憩時間が勤務時間を超えています。');
  if(!r)                        return ng('修正理由を入力してください。');

  target.in = i; target.out = o;
  if(breakEnabled) target.brk = b;   // OFFのときは保存済みの休憩分を書き換えない
  target.edited = true; target.reason = r;
  closeFix();
  render();
  toast('打刻を修正しました（履歴に記録されます）');
});

/* ---------------- 承認・CSV ---------------- */
function onApprove(){
  const miss = A.summarize(filtered()).missing;
  if(miss > 0){ toast('打刻漏れが ' + miss + '件あります。先に修正してください。'); return; }
  approved = true;
  render();
  toast('この月の勤怠を承認しました');
}

function onCsv(){
  const head = ['スタッフ','日付','出勤','退勤'];
  if(breakEnabled) head.push('休憩(分)');
  head.push('実働(分)','実働','状態','修正理由');
  const rows = [head];

  filtered().slice()
    .sort((a, b) => (a.staff + a.date).localeCompare(b.staff + b.date))
    .forEach(d => {
      const w = A.calcWork(d.in, d.out, brkOf(d));
      const r = [
        M.STAFF[d.staff].name, d.date,
        d.in  != null ? A.toStr(d.in)  : '',
        d.out != null ? A.toStr(d.out) : '',
      ];
      if(breakEnabled) r.push(Math.round(d.brk || 0));   // CSVにも小数を出さない
      r.push(
        w != null ? Math.round(w) : '',
        w != null ? A.fmtHM(w) : '',
        w == null ? '退勤未打刻' : (d.edited ? '修正済' : '通常'),
        d.reason || '',
      );
      rows.push(r);
    });
  const url = URL.createObjectURL(new Blob([A.toCsv(rows)], { type:'text/csv' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = '勤怠_' + $('fMonth').value + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('CSVを出力しました');
}

/* ---------------- トースト ---------------- */
let toastT;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

mount('system');
MockBar.init({
  role: 'system',
  onRole: r => mount(r),
  toggles: [
    {
      key:'brk', label:'この店舗で休憩打刻を使う', value: breakEnabled,
      onChange: v => { breakEnabled = v; render(); },
      note:'店舗ごとの設定。OFFにすると休憩列・休憩合計が消え、実働は 退勤−出勤 になります。',
    },
    {
      key:'fixot', type:'select', label:'固定残業（月あたり）', value: String(fixedOtMin),
      options: [
        { value:'0',    label:'固定残業なし' },
        { value:'1200', label:'20時間' },
        { value:'1800', label:'30時間' },
        { value:'2700', label:'45時間' },
      ],
      onChange: v => { fixedOtMin = Number(v); render(); },
      note:'30時間で 三浦さんが超過、佐藤さんが注意になります。45時間にすると両名とも通常です。',
    },
  ],
});
</script>
