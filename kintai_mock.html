<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalonOne｜打刻・勤怠管理 改善モック v0.1</title>
<!--
================================================================================
SalonOne 打刻 / 勤怠管理 UI改善モック v0.1
================================================================================
■ このモックの2画面
  [A] 打刻（スタッフ）  … /punch 相当。管理画面にスタッフが入って打刻する運用。
  [B] 勤怠管理（管理者）… /time-tracking 相当。月次の打刻一覧・修正・承認。

■ 現行実装で見つかった不具合（必ず直す）
  1) 時間表記が小数のまま
     現状: 合計 8h43.7166666666667m ／ 休憩 1h1.1666666666666643m
     原因: APIが work_minutes: 523.7166666666667（秒以下を含む float）を返し、
           フロントが `${Math.floor(m/60)}h${m%60}m` をそのまま描画している。
     対処: APIで秒を切り捨て整数分に丸める（推奨）＋フロントは必ず fmtHM() を通す。
           表示は「8時間44分」（一覧は 8:44）に統一。
  2) 退勤打刻が無い行の扱い
     現状: 勤務時間が「—」で終わり、打刻漏れだと気づけない。
     対処: 「退勤未打刻」バッジ＋画面上部にアラート集約＋修正導線。
  3) スタッフ絞り込みが無い
     現状: 全スタッフが1つの表にフラットに並ぶ。人数が増えると破綻。
     対処: スタッフ絞り込み＋スタッフ単位の小計行。
  4) 打刻の修正手段が無い
     現状: 押し間違い・打ち忘れを画面から直せない。
     対処: 行から修正モーダル（理由必須・変更履歴を残す）。
  5) スマホで横スクロールになる
     対処: 768px未満はカードレイアウトへ切替（本モックはCSSのみで実装）。

■ データモデル案
  time_punches   { id, staff_id, shop_id, type:'clock_in'|'break_start'|'break_end'|'clock_out',
                   recorded_at, lat, lng, distance_m, source:'app'|'manual', created_by }
  attendance_days{ staff_id, work_date, clock_in, clock_out, break_minutes(int),
                   work_minutes(int), status:'normal'|'missing_out'|'edited'|'absent',
                   is_edited, edit_reason, edited_by, edited_at, approved_at, approved_by }
  ※ break_minutes / work_minutes は「整数分」で保存する（小数を持たせない）。

■ API案
  POST /api/punches                              打刻（type と位置情報を送る）
  GET  /api/attendance?month=YYYY-MM&staff_id=   月次一覧（丸め済みの整数分で返す）
  PATCH /api/attendance/:staffId/:date           打刻修正（reason 必須）
  POST /api/attendance/approve                   月次承認（対象月・スタッフ）
  GET  /api/attendance/export?month=YYYY-MM      CSV出力

■ 集計ルール（要確認 → handoffメモの「未決事項」参照）
  実働 = 退勤 − 出勤 − 休憩合計
  残業 = max(0, 実働 − 所定労働時間(既定480分))
  深夜・法定休日の割増はこのモックでは未計算。

■ Next.js移植メモ（駒木さん向け）
  ・fmtHM() / calcWork() は utils/attendance.ts に切り出して
    サーバー・クライアント両方から使う（表示ブレ防止）。
  ・打刻のステートマシン（none→working→break→working→done）は
    サーバー側でも検証する。連打・二重打刻はAPI側で弾く。
  ・CSS変数はtailwind.configのthemeトークンへ対応付け（handoffメモ参照）。
================================================================================
-->
<style>
:root{
  --teal:#003737; --teal-2:#0B4A45; --teal-3:#106258;
  --gold:#C6A664; --gold-soft:#F3E9D5;
  --cream:#F4F4EF; --paper:#FFFFFF; --muted-bg:#F5F5F0;
  --ink:#22312F; --mut:#6E7B78; --line:#E4E4DC;
  --ok:#2E8B5F; --ok-soft:#E7F4EC;
  --warn:#B4740B; --warn-soft:#FBF0DC;
  --danger:#C4342B; --danger-soft:#FBEBEA;
  --info:#2F6DA8; --info-soft:#E9F1F9;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{
  background:var(--cream); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer;}
input,select{font:inherit; color:inherit;}
button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--teal-3); outline-offset:2px;}
.tnum{font-variant-numeric:tabular-nums;}

.wrap{max-width:1080px; margin:0 auto; padding:0 0 48px;}

/* ---------- ヘッダ／タブ ---------- */
.topbar{
  background:var(--teal); color:#fff; padding:12px 18px;
  display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:30;
}
.logo{font-family:"Playfair Display",Georgia,serif; font-size:18px; letter-spacing:.04em;}
.logo b{color:var(--gold);}
.topbar .who{margin-left:auto; font-size:12px; opacity:.85; text-align:right;}
.tabs{display:flex; gap:6px; padding:12px 18px 0; background:var(--cream); position:sticky; top:52px; z-index:29;}
.tab{
  padding:9px 18px; border-radius:10px 10px 0 0; background:#E9E9E1;
  color:var(--mut); font-weight:600; font-size:14px;
}
.tab.on{background:var(--paper); color:var(--teal); box-shadow:0 -2px 0 var(--gold) inset;}
.panel{display:none; padding:0 18px;}
.panel.on{display:block;}

.card{
  background:var(--paper); border:1px solid var(--line); border-radius:14px;
  padding:16px; margin-bottom:14px;
}
.card > h2{
  margin:0 0 12px; font-size:15px; font-weight:700; letter-spacing:.02em;
  display:flex; align-items:center; gap:8px;
}
.card > h2 .sub{font-size:12px; font-weight:400; color:var(--mut);}

/* ---------- [A] 打刻 ---------- */
.clockface{text-align:center; padding:6px 0 2px;}
.clockface .d{font-size:13px; color:var(--mut);}
.clockface .t{font-size:44px; font-weight:700; letter-spacing:.02em; line-height:1.1;}
.statusline{display:flex; justify-content:center; margin-top:6px;}
.pill{
  display:inline-flex; align-items:center; gap:6px; border-radius:999px;
  padding:4px 14px; font-size:12px; font-weight:700;
}
.pill::before{content:''; width:7px; height:7px; border-radius:50%; background:currentColor;}
.pill.none{background:var(--muted-bg); color:var(--mut);}
.pill.working{background:var(--ok-soft); color:var(--ok);}
.pill.break{background:var(--warn-soft); color:var(--warn);}
.pill.done{background:var(--info-soft); color:var(--info);}

.field{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.field label{font-size:12px; color:var(--mut); width:78px; flex:0 0 auto;}
.field select, .field input{
  flex:1; height:42px; border:1px solid var(--line); border-radius:10px;
  background:#fff; padding:0 10px;
}
.gps{
  display:flex; align-items:flex-start; gap:10px; border-radius:10px; padding:10px 12px;
  font-size:12.5px; margin-bottom:12px;
}
.gps.ok{background:var(--ok-soft); color:#1d6a45;}
.gps.ng{background:var(--danger-soft); color:var(--danger);}
.gps .ic{font-weight:700;}
.gps .re{margin-left:auto; text-decoration:underline; font-size:12px; white-space:nowrap;}

.punchgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.punchbtn{
  height:78px; border-radius:14px; font-size:17px; font-weight:700;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border:1.5px solid transparent; transition:transform .06s;
}
.punchbtn small{font-size:11px; font-weight:500; opacity:.8;}
.punchbtn:active{transform:scale(.985);}
.punchbtn.pri{background:var(--teal); color:#fff;}
.punchbtn.sec{background:#fff; border-color:var(--gold); color:var(--teal);}
.punchbtn.end{background:#fff; border-color:var(--line); color:var(--ink);}
.punchbtn:disabled{background:#EDEDE7; color:#A9B3B1; border-color:transparent; cursor:not-allowed;}
.punchbtn:disabled small{opacity:.9;}

.tl{list-style:none; margin:8px 0 0; padding:0;}
.tl li{
  display:flex; align-items:center; gap:10px; padding:9px 2px;
  border-bottom:1px dashed var(--line); font-size:13.5px;
}
.tl li:last-child{border-bottom:none;}
.tl .tt{width:60px; font-weight:700;}
.tl .lb{color:var(--mut);}
.tl .mk{margin-left:auto; font-size:11px; color:var(--mut);}
.empty{color:var(--mut); font-size:13px; padding:10px 2px;}

/* ---------- [B] 勤怠管理 ---------- */
.filters{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
.filters select{height:40px; border:1px solid var(--line); border-radius:10px; background:#fff; padding:0 10px;}
.filters .spacer{margin-left:auto;}
.btn{
  height:40px; padding:0 16px; border-radius:10px; font-size:13.5px; font-weight:600;
  display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:#fff;
}
.btn.solid{background:var(--teal); color:#fff; border-color:var(--teal);}
.btn.solid:disabled{background:#B9C4C1; border-color:#B9C4C1; cursor:not-allowed;}
.btn.ghost{background:#fff;}

.kpis{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px;}
.kpi{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
.kpi .l{font-size:11.5px; color:var(--mut);}
.kpi .v{font-size:22px; font-weight:700; letter-spacing:.01em; margin-top:2px;}
.kpi .v small{font-size:12px; font-weight:600; color:var(--mut); margin-left:2px;}
.kpi.alert .v{color:var(--danger);}

.alertbar{
  display:flex; align-items:center; gap:10px; background:var(--danger-soft);
  border:1px solid rgba(196,52,43,.3); color:var(--danger);
  border-radius:12px; padding:11px 14px; margin-bottom:14px; font-size:13px;
}
.alertbar b{font-weight:700;}
.alertbar .go{margin-left:auto; text-decoration:underline; color:var(--danger); font-weight:600; white-space:nowrap;}

.staffblock{background:var(--paper); border:1px solid var(--line); border-radius:14px; margin-bottom:14px; overflow:hidden;}
.sbhead{
  display:flex; align-items:center; gap:12px; padding:12px 16px;
  background:var(--muted-bg); border-bottom:1px solid var(--line);
}
.sbhead .nm{font-weight:700; font-size:15px;}
.sbhead .st{font-size:12px; color:var(--mut);}
.sbhead .tot{margin-left:auto; font-size:12.5px; color:var(--mut);}
.sbhead .tot b{font-size:15px; color:var(--ink);}
.sbhead .ap{
  margin-left:12px; font-size:11px; font-weight:700; border-radius:999px; padding:3px 10px;
  background:var(--ok-soft); color:var(--ok);
}

table{width:100%; border-collapse:collapse;}
thead th{
  font-size:11.5px; color:var(--mut); font-weight:600; text-align:center;
  padding:9px 8px; border-bottom:1px solid var(--line); background:#FAFAF6;
}
thead th.l{text-align:left;}
tbody td{padding:11px 8px; border-bottom:1px solid var(--line); text-align:center; font-size:13.5px;}
tbody td.l{text-align:left;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.miss{background:var(--danger-soft);}
tbody tr.off td{color:#A9B3B1;}
.dow{color:var(--mut); font-size:12px; margin-left:3px;}
.dow.sat{color:#2F6DA8;} .dow.sun{color:#C4342B;}
.tag{font-size:10.5px; font-weight:700; border-radius:6px; padding:2px 8px; white-space:nowrap;}
.tag.miss{background:#fff; color:var(--danger); border:1px solid rgba(196,52,43,.4);}
.tag.edited{background:var(--info-soft); color:var(--info);}
.tag.ot{background:var(--warn-soft); color:var(--warn);}
.tag.off{background:var(--muted-bg); color:var(--mut);}
.fixbtn{font-size:12px; color:var(--teal-3); text-decoration:underline; font-weight:600;}
.mono{font-variant-numeric:tabular-nums;}
.dash{color:#C3CBC9;}

/* モバイル：カード表示へ */
.mobcards{display:none;}
@media (max-width:768px){
  .kpis{grid-template-columns:repeat(2,1fr);}
  .kpi:first-child{grid-column:span 2;}
  table.daytable{display:none;}
  .mobcards{display:block; padding:8px 12px 12px;}
  .mrow{border:1px solid var(--line); border-radius:11px; padding:10px 12px; margin-top:8px;}
  .mrow.miss{border-color:rgba(196,52,43,.45); background:var(--danger-soft);}
  .mrow .r1{display:flex; align-items:center; gap:8px;}
  .mrow .dt{font-weight:700;}
  .mrow .r1 .right{margin-left:auto; font-weight:700;}
  .mrow .r2{display:flex; gap:14px; margin-top:6px; font-size:12.5px; color:var(--mut);}
  .mrow .r3{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .punchgrid{grid-template-columns:1fr 1fr;}
  .filters .spacer{margin-left:0; width:100%;}
}
@media (max-width:430px){
  .clockface .t{font-size:38px;}
  .panel{padding:0 12px;}
  .tabs{padding:12px 12px 0;}
}

/* ---------- モーダル ---------- */
.mask{
  position:fixed; inset:0; background:rgba(20,30,28,.45); z-index:70;
  display:none; align-items:flex-end; justify-content:center;
}
.mask.show{display:flex;}
@media (min-width:600px){ .mask.show{align-items:center;} }
.modal{
  background:#fff; width:100%; max-width:460px; border-radius:16px 16px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
}
@media (min-width:600px){ .modal{border-radius:16px;} }
.modal h3{margin:0 0 4px; font-size:16px;}
.modal .mdate{font-size:12.5px; color:var(--mut); margin-bottom:14px;}
.mgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.mfield label{display:block; font-size:11.5px; color:var(--mut); margin-bottom:4px;}
.mfield input, .mfield textarea, .mfield select{
  width:100%; border:1px solid var(--line); border-radius:10px; background:#fff;
  padding:9px 10px; height:42px;
}
.mfield textarea{height:70px; resize:vertical; font-family:inherit;}
.mfield{margin-bottom:12px;}
.calcline{
  background:var(--muted-bg); border-radius:10px; padding:10px 12px; font-size:13px;
  display:flex; justify-content:space-between; margin-bottom:12px;
}
.calcline b{font-size:15px;}
.err{color:var(--danger); font-size:12px; margin:-6px 0 10px; display:none;}
.err.show{display:block;}
.mactions{display:flex; gap:8px;}
.mactions .btn{flex:1; height:46px; justify-content:center;}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,16px);
  background:var(--teal); color:#fff; font-size:13px; padding:10px 18px;
  border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.25);
  opacity:0; pointer-events:none; transition:.2s; z-index:90; max-width:88%; text-align:center;
}
.toast.show{opacity:1; transform:translate(-50%,0);}
.note{font-size:11.5px; color:var(--mut); padding:2px 4px 0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Salon<b>One</b></div>
  <div class="who">si'se 町田店<br>システム運用（ROOT）</div>
</div>

<div class="tabs">
  <button class="tab on" data-tab="punch">打刻（スタッフ）</button>
  <button class="tab" data-tab="admin">勤怠管理（管理者）</button>
</div>

<div class="wrap">

  <!-- ============ [A] 打刻 ============ -->
  <section class="panel on" id="panel-punch">
    <div class="card">
      <div class="clockface">
        <div class="d" id="pDate">2026年8月20日(木)</div>
        <div class="t tnum" id="pClock">--:--:--</div>
        <div class="statusline"><span class="pill none" id="pStatus">未出勤</span></div>
      </div>
    </div>

    <div class="card">
      <h2>打刻する</h2>
      <div class="field">
        <label for="pStaff">スタッフ</label>
        <select id="pStaff">
          <option value="miura">三浦 和真</option>
          <option value="sato" selected>佐藤 享哉</option>
        </select>

      <div class="gps ok" id="pGps">
        <span class="ic">✓</span>
        <span id="pGpsText">店舗の範囲内です（店舗から 38m / 許可範囲 200m）</span>

        <button class="punchbtn sec" data-type="break_start">休憩開始<small>離席します</small></button>
        <button class="punchbtn sec" data-type="break_end">休憩戻り<small>勤務にもどる</small></button>
      </div>
      <p class="note">押せるボタンだけが有効になります（二重打刻・順序ミスを画面側で防止）。</p>
    </div>

    <div class="card">
      <h2>今日の打刻 <span class="sub" id="pSummary"></span></h2>
      <ul class="tl" id="pTimeline"></ul>
    </div>
  </section>

  <!-- ============ [B] 勤怠管理 ============ -->
  <section class="panel" id="panel-admin">
    <div class="card">
      <h2>勤怠管理 <span class="sub">月次の打刻実績を確認・修正します</span></h2>
      <div class="filters">
        <select id="fMonth">
          <option value="2026-08" selected>2026年8月</option>
          <option value="2026-07">2026年7月</option>
        </select>
        <select id="fStaff">
          <option value="all">全スタッフ</option>
          <option value="miura">三浦 和真</option>
          <option value="sato">佐藤 享哉</option>
        </select>
        <select id="fStatus">
          <option value="all">すべての状態</option>
          <option value="miss">打刻漏れのみ</option>
          <option value="edited">修正済みのみ</option>
        </select>
        <span class="spacer"></span>
        <button class="btn ghost" id="btnCsv">CSV出力</button>
        <button class="btn solid" id="btnApprove">この月を承認</button>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>
    <div id="alerts"></div>
    <div id="list"></div>
    <p class="note">所定労働時間は 8時間0分／日として残業を算出しています（設定値・要確認）。</p>
  </section>

</div>

<!-- 打刻修正モーダル -->
<div class="mask" id="mask">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle">打刻を修正</h3>
    <div class="mdate" id="mDate">—</div>

    <div class="mgrid">
      <div class="mfield">
        <label for="mIn">出勤</label>
        <input type="time" id="mIn" step="60">
      </div>
      <div class="mfield">
        <label for="mOut">退勤</label>
        <input type="time" id="mOut" step="60">
      </div>
    </div>
    <div class="mfield">
      <label for="mBreak">休憩（分）</label>
      <input type="number" id="mBreak" min="0" max="480" step="5">
    </div>

    <div class="calcline">
      <span>実働時間</span><b id="mCalc">—</b>
    </div>

    <div class="mfield">
      <label for="mReason">修正理由（必須・履歴に残ります）</label>
      <textarea id="mReason" placeholder="例：退勤打刻を忘れたため、シフト終了時刻で登録"></textarea>
    </div>
    <div class="err" id="mErr"></div>

    <div class="mactions">
      <button class="btn ghost" id="mCancel">キャンセル</button>
      <button class="btn solid" id="mSave">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
'use strict';

/* ================= 共通ユーティリティ ================= */
const STANDARD_MIN = 480;              // 所定労働時間（分）＝8時間。設定化する想定。
const pad = n => String(n).padStart(2, '0');

/** 分(小数可) → "8:44" 表記。必ずここを通す（現行バグ対策） */
function fmtHM(min){
  if(min == null) return '—';
  const t = Math.round(min);
  return Math.floor(t / 60) + ':' + pad(t % 60);
}
/** 分(小数可) → "8時間44分" 表記 */
function fmtJa(min){
  if(min == null) return '—';
  const t = Math.round(min);
  const h = Math.floor(t / 60), m = t % 60;
  if(h && m) return h + '時間' + m + '分';
  if(h) return h + '時間';
  return m + '分';
}
/** "09:15" → 555 */
const toMin = s => { if(!s) return null; const [h, m] = s.split(':').map(Number); return h * 60 + m; };
/** 555 → "09:15" */
const toStr = m => (m == null ? '' : pad(Math.floor(m / 60)) + ':' + pad(m % 60));
/** 実働 = 退勤 − 出勤 − 休憩 */
function calcWork(inM, outM, brk){
  if(inM == null || outM == null) return null;
  return Math.max(0, outM - inM - (brk || 0));
}
const DOW = ['日','月','火','水','木','金','土'];

/* ================= マスタ・データ ================= */
const STAFF = {
  miura: { name: '三浦 和真', shop: 'si\'se 町田店' },
  sato:  { name: '佐藤 享哉', shop: 'si\'se 町田店' },
};

/*
  現行APIが返している値（小数を含む）をそのまま入れてある。
  breakMin: 61.1666… / 56.4666… → 画面では fmtHM/fmtJa で丸めて表示する。
*/
let days = [
  { staff:'miura', date:'2026-08-01', in:555, out:1140, brk:61.1666666666666643, edited:false, reason:'' },
  { staff:'miura', date:'2026-08-02', in:573, out:null, brk:56.46666666666667,   edited:false, reason:'' },
  { staff:'miura', date:'2026-08-04', in:600, out:1170, brk:60, edited:false, reason:'' },
  { staff:'miura', date:'2026-08-05', in:592, out:1125, brk:45, edited:false, reason:'' },
  { staff:'miura', date:'2026-08-07', in:600, out:1140, brk:60, edited:false, reason:'' },
  { staff:'sato',  date:'2026-08-01', in:600, out:1155, brk:60, edited:false, reason:'' },
  { staff:'sato',  date:'2026-08-02', in:605, out:1140, brk:60, edited:false, reason:'' },
  { staff:'sato',  date:'2026-08-05', in:598, out:null, brk:45, edited:false, reason:'' },
  { staff:'sato',  date:'2026-08-06', in:600, out:1230, brk:60, edited:true,
    reason:'退勤打刻を忘れたためシフト終了時刻で登録' },
];
let approved = false;

/* ================= タブ ================= */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('panel-' + t.dataset.tab).classList.add('on');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

/* ================= [A] 打刻 ================= */
let punchState = 'none';   // none | working | break | done
let punches = [];          // {type, at(min)}
let gpsOk = true;

const LABEL = { clock_in:'出勤', break_start:'休憩開始', break_end:'休憩戻り', clock_out:'退勤' };
const ALLOWED = {
  none:    ['clock_in'],
  working: ['break_start','clock_out'],
  break:   ['break_end'],
  done:    [],
};
const NEXT = {
  clock_in:'working', break_start:'break', break_end:'working', clock_out:'done',
};
const STATUS_TEXT = { none:'未出勤', working:'勤務中', break:'休憩中', done:'退勤済み' };

function tickClock(){
  const d = new Date();
  document.getElementById('pClock').textContent =
    pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  document.getElementById('pDate').textContent =
    d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日(' + DOW[d.getDay()] + ')';
}
tickClock();
setInterval(tickClock, 1000);

function renderPunch(){
  const st = document.getElementById('pStatus');
  st.className = 'pill ' + punchState;
  st.textContent = STATUS_TEXT[punchState];

  document.querySelectorAll('.punchbtn').forEach(b => {
    b.disabled = !ALLOWED[punchState].includes(b.dataset.type) || !gpsOk;
  });

  const tl = document.getElementById('pTimeline');
  tl.innerHTML = '';
  if(!punches.length){
    tl.innerHTML = '<li class="empty">まだ打刻はありません。上のボタンから打刻してください。</li>';
  }else{
    punches.forEach(p => {
      const li = document.createElement('li');
      li.innerHTML =
        '<span class="tt tnum">' + toStr(p.at) + '</span>' +
        '<span class="lb">' + LABEL[p.type] + '</span>' +
        '<span class="mk">GPS確認済み</span>';
      tl.appendChild(li);
    });
  }

  // 経過サマリー
  const inP = punches.find(p => p.type === 'clock_in');
  const outP = punches.find(p => p.type === 'clock_out');
  let brk = 0, bs = null;
  punches.forEach(p => {
    if(p.type === 'break_start') bs = p.at;
    if(p.type === 'break_end' && bs != null){ brk += p.at - bs; bs = null; }
  });
  const now = new Date().getHours() * 60 + new Date().getMinutes();
  const sum = document.getElementById('pSummary');
  if(inP){
    const end = outP ? outP.at : now;
    sum.textContent = '実働 ' + fmtJa(Math.max(0, end - inP.at - brk)) + '／休憩 ' + fmtJa(brk);
  }else{
    sum.textContent = '';
  }
}

document.querySelectorAll('.punchbtn').forEach(b => {
  b.addEventListener('click', () => {
    const type = b.dataset.type;
    if(!ALLOWED[punchState].includes(type) || !gpsOk) return;
    const d = new Date();
    punches.push({ type: type, at: d.getHours() * 60 + d.getMinutes() });
    punchState = NEXT[type];
    renderPunch();
    toast(LABEL[type] + 'を記録しました（' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + '）');
  });
});

document.getElementById('pGpsToggle').addEventListener('click', () => {
  gpsOk = !gpsOk;
  const box = document.getElementById('pGps');
  box.className = 'gps ' + (gpsOk ? 'ok' : 'ng');
  box.querySelector('.ic').textContent = gpsOk ? '✓' : '！';
  document.getElementById('pGpsText').textContent = gpsOk
    ? '店舗の範囲内です（店舗から 38m / 許可範囲 200m）'
    : '店舗の範囲外です（店舗から 1,240m）。店舗に着いてから打刻してください。';
  renderPunch();
});

document.getElementById('pStaff').addEventListener('change', () => {
  punchState = 'none'; punches = []; renderPunch();
  toast('スタッフを切り替えました');
});

renderPunch();

/* ================= [B] 勤怠管理 ================= */
function filtered(){
  const st = document.getElementById('fStaff').value;
  const stt = document.getElementById('fStatus').value;
  const mon = document.getElementById('fMonth').value;
  return days.filter(d => {
    if(!d.date.startsWith(mon)) return false;
    if(st !== 'all' && d.staff !== st) return false;
    if(stt === 'miss' && d.out != null) return false;
    if(stt === 'edited' && !d.edited) return false;
    return true;
  });
}

function renderAdmin(){
  const rows = filtered();

  /* --- KPI --- */
  let work = 0, brk = 0, ot = 0, miss = 0;
  const dset = new Set();
  rows.forEach(d => {
    dset.add(d.staff + d.date);
    brk += d.brk || 0;
    const w = calcWork(d.in, d.out, d.brk);
    if(w == null){ miss++; }
    else { work += w; ot += Math.max(0, w - STANDARD_MIN); }
  });
  document.getElementById('kpis').innerHTML =
    kpi('総勤務時間', fmtJa(work)) +
    kpi('出勤日数', dset.size + '<small>日</small>') +
    kpi('休憩合計', fmtJa(brk)) +
    kpi('残業合計', fmtJa(ot)) +
    kpi('打刻漏れ', miss + '<small>件</small>', miss > 0);

  /* --- アラート --- */
  const al = document.getElementById('alerts');
  al.innerHTML = miss > 0
    ? '<div class="alertbar"><b>退勤の打刻漏れが ' + miss + '件</b> あります。給与計算前に修正してください。' +
      '<button class="go" id="goMiss">該当だけ表示</button></div>'
    : '';
  const gm = document.getElementById('goMiss');
  if(gm) gm.addEventListener('click', () => {
    document.getElementById('fStatus').value = 'miss';
    renderAdmin();
  });

  /* --- スタッフ別ブロック --- */
  const list = document.getElementById('list');
  list.innerHTML = '';
  const byStaff = {};
  rows.forEach(d => { (byStaff[d.staff] = byStaff[d.staff] || []).push(d); });

  const keys = Object.keys(byStaff);
  if(!keys.length){
    list.innerHTML = '<div class="card"><div class="empty">条件に一致する勤怠データがありません。</div></div>';
    return;
  }

  keys.forEach(sid => {
    const items = byStaff[sid].slice().sort((a, b) => a.date.localeCompare(b.date));
    let sw = 0, sm = 0;
    items.forEach(d => {
      const w = calcWork(d.in, d.out, d.brk);
      if(w == null) sm++; else sw += w;
    });

    const block = document.createElement('div');
    block.className = 'staffblock';
    block.innerHTML =
      '<div class="sbhead">' +
        '<div><div class="nm">' + STAFF[sid].name + '</div>' +
        '<div class="st">' + STAFF[sid].shop + ' ・ ' + items.length + '日出勤' +
        (sm ? ' ・ <span style="color:var(--danger)">打刻漏れ ' + sm + '件</span>' : '') + '</div></div>' +
        '<div class="tot">合計実働 <b>' + fmtJa(sw) + '</b></div>' +
        (approved ? '<span class="ap">承認済み</span>' : '') +
      '</div>' +
      '<table class="daytable"><thead><tr>' +
        '<th class="l">日付</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th><th>状態</th><th></th>' +
      '</tr></thead><tbody></tbody></table>' +
      '<div class="mobcards"></div>';

    const tb = block.querySelector('tbody');
    const mc = block.querySelector('.mobcards');

    items.forEach(d => {
      const w = calcWork(d.in, d.out, d.brk);
      const miss = (w == null);
      const otm = (w != null) ? Math.max(0, w - STANDARD_MIN) : 0;
      const dt = new Date(d.date + 'T00:00:00');
      const dowIdx = dt.getDay();
      const dowCls = dowIdx === 0 ? 'sun' : (dowIdx === 6 ? 'sat' : '');
      const dlabel = (dt.getMonth() + 1) + '/' + dt.getDate() +
        '<span class="dow ' + dowCls + '">(' + DOW[dowIdx] + ')</span>';
      let tags = '';
      if(miss)     tags += '<span class="tag miss">退勤未打刻</span> ';
      if(d.edited) tags += '<span class="tag edited">修正済</span> ';
      if(otm > 0)  tags += '<span class="tag ot">残業 ' + fmtJa(otm) + '</span>';
      if(!tags)    tags = '<span class="tag off">通常</span>';

      const tr = document.createElement('tr');
      if(miss) tr.className = 'miss';
      tr.innerHTML =
        '<td class="l">' + dlabel + '</td>' +
        '<td class="mono">' + (d.in != null ? toStr(d.in) : '<span class="dash">—</span>') + '</td>' +
        '<td class="mono">' + (d.out != null ? toStr(d.out) : '<span class="dash">—</span>') + '</td>' +
        '<td class="mono">' + fmtHM(d.brk) + '</td>' +
        '<td class="mono"><b>' + (w != null ? fmtHM(w) : '<span class="dash">—</span>') + '</b></td>' +
        '<td>' + tags + '</td>' +
        '<td><button class="fixbtn">修正</button></td>';
      tr.querySelector('.fixbtn').addEventListener('click', () => openFix(d));
      tb.appendChild(tr);

      const card = document.createElement('div');
      card.className = 'mrow' + (miss ? ' miss' : '');
      card.innerHTML =
        '<div class="r1"><span class="dt">' + dlabel + '</span>' +
        '<span class="right mono">' + (w != null ? fmtJa(w) : '—') + '</span></div>' +
        '<div class="r2"><span>出勤 <b class="mono">' + (d.in != null ? toStr(d.in) : '—') + '</b></span>' +
        '<span>退勤 <b class="mono">' + (d.out != null ? toStr(d.out) : '—') + '</b></span>' +
        '<span>休憩 <b class="mono">' + fmtHM(d.brk) + '</b></span></div>' +
        '<div class="r3">' + tags + '<span style="margin-left:auto"><button class="fixbtn">修正</button></span></div>';
      card.querySelector('.fixbtn').addEventListener('click', () => openFix(d));
      mc.appendChild(card);
    });

    list.appendChild(block);
  });
}

function kpi(label, val, alert){
  return '<div class="kpi' + (alert ? ' alert' : '') + '">' +
         '<div class="l">' + label + '</div><div class="v tnum">' + val + '</div></div>';
}

['fMonth','fStaff','fStatus'].forEach(id =>
  document.getElementById(id).addEventListener('change', renderAdmin));

/* ================= 修正モーダル ================= */
let target = null;
const mask = document.getElementById('mask');

function openFix(d){
  target = d;
  document.getElementById('mDate').textContent =
    STAFF[d.staff].name + ' ／ ' + d.date.replace(/-/g, '/') +
    (d.edited ? '（修正履歴あり：' + d.reason + '）' : '');
  document.getElementById('mIn').value = toStr(d.in);
  document.getElementById('mOut').value = toStr(d.out);
  document.getElementById('mBreak').value = Math.round(d.brk || 0);
  document.getElementById('mReason').value = '';
  document.getElementById('mErr').classList.remove('show');
  recalcModal();
  mask.classList.add('show');
}
function closeFix(){ mask.classList.remove('show'); target = null; }

function recalcModal(){
  const i = toMin(document.getElementById('mIn').value);
  const o = toMin(document.getElementById('mOut').value);
  const b = Number(document.getElementById('mBreak').value || 0);
  const w = calcWork(i, o, b);
  document.getElementById('mCalc').textContent = (w != null ? fmtJa(w) : '退勤時刻を入力してください');
}
['mIn','mOut','mBreak'].forEach(id =>
  document.getElementById(id).addEventListener('input', recalcModal));

document.getElementById('mCancel').addEventListener('click', closeFix);
mask.addEventListener('click', e => { if(e.target === mask) closeFix(); });

document.getElementById('mSave').addEventListener('click', () => {
  if(!target) return;
  const i = toMin(document.getElementById('mIn').value);
  const o = toMin(document.getElementById('mOut').value);
  const b = Number(document.getElementById('mBreak').value || 0);
  const r = document.getElementById('mReason').value.trim();
  const err = document.getElementById('mErr');

  if(i == null){ err.textContent = '出勤時刻を入力してください。'; err.classList.add('show'); return; }
  if(o != null && o <= i){ err.textContent = '退勤時刻は出勤時刻より後にしてください。'; err.classList.add('show'); return; }
  if(o != null && (o - i) < b){ err.textContent = '休憩時間が勤務時間を超えています。'; err.classList.add('show'); return; }
  if(!r){ err.textContent = '修正理由を入力してください。'; err.classList.add('show'); return; }

  target.in = i; target.out = o; target.brk = b;
  target.edited = true; target.reason = r;
  closeFix();
  renderAdmin();
  toast('打刻を修正しました（履歴に記録されます）');
});

/* ================= 承認・CSV ================= */
document.getElementById('btnApprove').addEventListener('click', () => {
  const miss = filtered().filter(d => d.out == null).length;
  if(miss > 0){ toast('打刻漏れが ' + miss + '件あります。先に修正してください。'); return; }
  approved = true;
  renderAdmin();
  toast('この月の勤怠を承認しました');
});

document.getElementById('btnCsv').addEventListener('click', () => {
  const rows = [['スタッフ','日付','出勤','退勤','休憩(分)','実働(分)','実働','状態','修正理由']];
  filtered().slice().sort((a, b) =>
    (a.staff + a.date).localeCompare(b.staff + b.date)
  ).forEach(d => {
    const w = calcWork(d.in, d.out, d.brk);
    rows.push([
      STAFF[d.staff].name, d.date,
      d.in != null ? toStr(d.in) : '',
      d.out != null ? toStr(d.out) : '',
      Math.round(d.brk || 0),
      w != null ? Math.round(w) : '',
      w != null ? fmtHM(w) : '',
      w == null ? '退勤未打刻' : (d.edited ? '修正済' : '通常'),
      d.reason || '',
    ]);
  });
  const csv = '\uFEFF' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = '勤怠_' + document.getElementById('fMonth').value + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('CSVを出力しました');
});

/* ================= トースト ================= */
let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

renderAdmin();
</script>
