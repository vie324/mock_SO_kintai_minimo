<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalonOne｜打刻（スタッフ）</title>
<!--
================================================================================
[打刻] スタッフが出退勤を打刻する画面   → 移植先: /punch
================================================================================
■ 想定運用
  店舗の共用PC / スタッフ個人のスマホ、どちらからも同じ画面で打刻する。
  1ファイルでPC・スマホ両対応（768pxで1カラムへ）。

■ この画面の要点
  1. 押せる打刻ボタンだけを有効にする（二重打刻・順序ミスを画面側で防ぐ）
     ステートマシンは assets/attendance.js の PUNCH_ALLOWED / PUNCH_NEXT が正。
     ※ 画面の制御は「押させない」ためのもの。サーバー側でも必ず同じ検証をする。
  2. GPSが範囲外なら全ボタンをロックする
     完全ブロックか、理由付きで許可して管理者に通知かは未決（メモ §5-12）。
  3. 実働・休憩の途中経過をその場で出す（休憩中は現在時刻まで加算）

■ API
  POST /api/punches   { staff_id, type, recorded_at, lat, lng }
  ・連打・二重打刻はAPI側で弾く
  ・recorded_at はサーバー時刻を正とする（端末時計は信用しない）
================================================================================
-->
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<style>
.topbar{
  background:var(--teal); color:#fff; padding:12px 18px;
  display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:30;
}
.logo{font-family:"Playfair Display",Georgia,serif; font-size:18px; letter-spacing:.04em;}
.logo b{color:var(--gold);}
.topbar .who{margin-left:auto; font-size:12px; opacity:.85; text-align:right; line-height:1.4;}

.wrap{max-width:1000px; margin:0 auto; padding:18px 18px 48px;}

/* PCは2カラム、スマホは1カラム */
.layout{display:grid; grid-template-columns:1.15fr .85fr; gap:14px; align-items:start;}

/* ---------- 時計 ---------- */
.clockface{text-align:center; padding:10px 0 6px;}
.clockface .d{font-size:13px; color:var(--mut);}
.clockface .t{font-size:56px; font-weight:700; letter-spacing:.02em; line-height:1.05;}
.statusline{display:flex; justify-content:center; margin-top:8px;}

/* ---------- 入力 ---------- */
.field{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.field label{font-size:12px; color:var(--mut); width:78px; flex:0 0 auto;}
.field select{
  flex:1; height:42px; border:1px solid var(--line); border-radius:10px;
  background:#fff; padding:0 10px;
}
.gps{
  display:flex; align-items:flex-start; gap:10px; border-radius:10px; padding:10px 12px;
  font-size:12.5px; margin-bottom:12px;
}
.gps.ok{background:var(--ok-soft); color:#1d6a45;}
.gps.ng{background:var(--danger-soft); color:var(--danger);}
.gps .ic{font-weight:700;}
.gps .re{margin-left:auto; text-decoration:underline; font-size:12px; white-space:nowrap;}

/* ---------- 打刻ボタン ---------- */
.punchgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.punchbtn{
  height:88px; border-radius:14px; font-size:18px; font-weight:700;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border:1.5px solid transparent; transition:transform .06s;
}
.punchbtn small{font-size:11px; font-weight:500; opacity:.8;}
.punchbtn:active:not(:disabled){transform:scale(.985);}
.punchbtn.pri{background:var(--teal); color:#fff;}
.punchbtn.sec{background:#fff; border-color:var(--gold); color:var(--teal);}
.punchbtn.end{background:#fff; border-color:var(--line); color:var(--ink);}
.punchbtn:disabled{background:#EDEDE7; color:#A9B3B1; border-color:transparent; cursor:not-allowed;}
.punchbtn:disabled small{opacity:.9;}

/* ---------- タイムライン ---------- */
.tl{list-style:none; margin:8px 0 0; padding:0;}
.tl li{
  display:flex; align-items:center; gap:10px; padding:10px 2px;
  border-bottom:1px dashed var(--line); font-size:13.5px;
}
.tl li:last-child{border-bottom:none;}
.tl .tt{width:58px; font-weight:700;}
.tl .lb{color:var(--mut);}
.tl .mk{margin-left:auto; font-size:11px; color:var(--mut);}
.empty{color:var(--mut); font-size:13px; padding:12px 2px;}

.progress{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px;}
.pbox{background:var(--muted-bg); border-radius:10px; padding:10px 12px;}
.pbox .l{font-size:11.5px; color:var(--mut);}
.pbox .v{font-size:20px; font-weight:700; margin-top:1px;}

@media (max-width:768px){
  .layout{grid-template-columns:1fr;}
  .wrap{padding:12px 12px 40px;}
  .clockface .t{font-size:44px;}
  .punchbtn{height:78px; font-size:17px;}
}
@media (max-width:430px){
  .clockface .t{font-size:40px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Salon<b>One</b></div>
  <div class="who" id="topWho">si'se 町田店<br>打刻</div>
</div>

<div class="wrap">
  <div class="card">
    <div class="clockface">
      <div class="d" id="pDate">—</div>
      <div class="t tnum" id="pClock">--:--:--</div>
      <div class="statusline"><span class="pill none" id="pStatus">未出勤</span></div>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="card">
        <h2>打刻する</h2>
        <div class="field">
          <label for="pStaff">スタッフ</label>
          <select id="pStaff"></select>
        </div>
        <div class="gps ok" id="pGps">
          <span class="ic" id="pGpsIc">✓</span>
          <span id="pGpsText"></span>
          <button class="re" id="pGpsToggle">状態を切替</button>
        </div>
        <div class="punchgrid">
          <button class="punchbtn pri" data-type="clock_in">出勤<small>勤務をはじめる</small></button>
          <button class="punchbtn end" data-type="clock_out">退勤<small>勤務をおわる</small></button>
          <button class="punchbtn sec" data-type="break_start">休憩開始<small>離席します</small></button>
          <button class="punchbtn sec" data-type="break_end">休憩戻り<small>勤務にもどる</small></button>
        </div>
        <p class="note">押せるボタンだけが有効になります（二重打刻・順序ミスを画面側で防止）。</p>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>今日の打刻</h2>
        <div class="progress">
          <div class="pbox"><div class="l">実働（途中経過）</div><div class="v tnum" id="pWork">—</div></div>
          <div class="pbox"><div class="l">休憩</div><div class="v tnum" id="pBreak">—</div></div>
        </div>
        <ul class="tl" id="pTimeline"></ul>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="../assets/attendance.js"></script>
<script src="../assets/mockdata.js"></script>
<script>
'use strict';
const A = window.Attendance, M = window.MockData;

/* ---------------- 状態 ----------------
   移植時は useState 3つ（state / punches / gpsOk）にそのまま対応する */
let punchState = 'none';   // none | working | break | done
let punches    = [];       // { type, at(0:00からの分) }
let gpsOk      = true;

const $ = id => document.getElementById(id);
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

/* ---------------- スタッフ選択 ---------------- */
M.STAFF_ORDER.forEach(id => {
  const o = document.createElement('option');
  o.value = id; o.textContent = M.STAFF[id].name;
  $('pStaff').appendChild(o);
});
$('pStaff').value = 'sato';
$('topWho').innerHTML = M.SHOP.name + '<br>打刻';

/* ---------------- 時計 ---------------- */
function tickClock(){
  const d = new Date();
  $('pClock').textContent = A.pad(d.getHours()) + ':' + A.pad(d.getMinutes()) + ':' + A.pad(d.getSeconds());
  $('pDate').textContent =
    d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日(' + A.DOW[d.getDay()] + ')';
}
tickClock();
setInterval(tickClock, 1000);
setInterval(() => { if(punchState === 'working' || punchState === 'break') render(); }, 30000);

/* ---------------- 描画 ---------------- */
function render(){
  const st = $('pStatus');
  st.className = 'pill ' + punchState;
  st.textContent = A.PUNCH_STATUS[punchState];

  document.querySelectorAll('.punchbtn').forEach(b => {
    b.disabled = !A.canPunch(punchState, b.dataset.type) || !gpsOk;
  });

  const tl = $('pTimeline');
  tl.innerHTML = '';
  if(!punches.length){
    tl.innerHTML = '<li class="empty">まだ打刻はありません。上のボタンから打刻してください。</li>';
  }else{
    punches.forEach(p => {
      const li = document.createElement('li');
      li.innerHTML =
        '<span class="tt tnum">' + A.toStr(p.at) + '</span>' +
        '<span class="lb">' + A.PUNCH_LABEL[p.type] + '</span>' +
        '<span class="mk">GPS確認済み</span>';
      tl.appendChild(li);
    });
  }

  const pr = A.punchProgress(punches, nowMin());
  $('pWork').textContent  = pr.work == null ? '—' : A.fmtJa(pr.work);
  $('pBreak').textContent = punches.length ? A.fmtJa(pr.brk) : '—';
}

/* ---------------- 打刻 ---------------- */
document.querySelectorAll('.punchbtn').forEach(b => {
  b.addEventListener('click', () => {
    const type = b.dataset.type;
    if(!A.canPunch(punchState, type) || !gpsOk) return;   // 二重防御
    const at = nowMin();
    punches.push({ type: type, at: at });
    punchState = A.PUNCH_NEXT[type];
    render();
    toast(A.PUNCH_LABEL[type] + 'を記録しました（' + A.toStr(at) + '）');
  });
});

/* ---------------- GPS（モックは手動トグル） ---------------- */
$('pGpsToggle').addEventListener('click', () => { gpsOk = !gpsOk; renderGps(); render(); });
function renderGps(){
  $('pGps').className = 'gps ' + (gpsOk ? 'ok' : 'ng');
  $('pGpsIc').textContent = gpsOk ? '✓' : '！';
  $('pGpsText').textContent = gpsOk
    ? '店舗の範囲内です（店舗から 38m / 許可範囲 ' + M.SHOP.allowedRadiusM + 'm）'
    : '店舗の範囲外です（店舗から 1,240m）。店舗に着いてから打刻してください。';
}

/* ---------------- スタッフ切替 ---------------- */
$('pStaff').addEventListener('change', () => {
  punchState = 'none'; punches = [];
  render();
  toast('スタッフを切り替えました');
});

/* ---------------- トースト ---------------- */
let toastT;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

renderGps();
render();
</script>
</body>
</html>
